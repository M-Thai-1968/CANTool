  help.topic.appendix_c.title: "Annexe C : pack vFlash et manifeste"
  help.topic.appendix_c.html: |-
    <h1>Annexe C : pack vFlash et manifeste</h1>
    <p>L'onglet vFlash de la section Diagnostic charge un paquet de flashage, l'interprète et l'exécute avec la séquence de flashage UDS intégrée sur le matériel sélectionné (Vector, PEAK, SocketCAN, simulation). Le logiciel Vector vFlash n'est pas nécessaire.</p>
    <h2>Sources prises en charge</h2>
    <ul><li><code>*.vflashpack</code> ou <code>*.zip</code> avec <code>flashpack.json</code> (ou <code>flashpack.yaml</code>) et les fichiers de données : entièrement pris en charge.</li><li>Pack vFlash authentique sans manifeste : le format interne n'est pas documenté publiquement. Les fichiers HEX, S-record et BIN sont détectés et le projet est lu de façon heuristique. La séquence, les adresses et le Seed&amp;Key doivent généralement être ajoutés via un manifeste.</li><li>Fichier manifeste unique ou image (<code>.hex</code>, <code>.s19</code>, <code>.srec</code>, <code>.mot</code>, <code>.bin</code>) avec la séquence générique par défaut.</li></ul>
    <h2>Manifeste flashpack.json</h2>
    [[pre:flashpack]]
    <table border="1" cellspacing="0" cellpadding="4" width="100%"><tr><th width="24%" align="left">Élément</th><th width="76%" align="left">Signification</th></tr><tr><td valign='top'><code>name</code>, <code>ecu</code></td><td valign='top'>Nom affiché et calculateur.</td></tr><tr><td valign='top'><code>request_id</code>, <code>response_id</code>, <code>extended</code>, <code>fd</code></td><td valign='top'>Adressage ISO-TP ; en son absence, la configuration de diagnostic de la section Diagnostic s'applique.</td></tr><tr><td valign='top'><code>security</code></td><td valign='top'>Seed&amp;Key : <code>type</code> = <code>none</code>, <code>xor</code>, <code>add</code> ou <code>constant</code>, plus <code>level</code> (niveau du seed, key = niveau + 1) et <code>value</code>.</td></tr><tr><td valign='top'><code>address_format</code></td><td valign='top'>addressAndLengthFormatIdentifier, p. ex. <code>0x44</code> = longueur sur 4 octets et adresse sur 4 octets.</td></tr><tr><td valign='top'><code>max_chunk</code></td><td valign='top'>Limite supérieure des données utiles par requête de transfert (sinon tirée de la réponse à 0x34).</td></tr><tr><td valign='top'><code>data</code></td><td valign='top'>Liste des fichiers de données (<code>file</code>, <code>name</code>) ; pour les fichiers BIN, <code>address</code> est obligatoire.</td></tr><tr><td valign='top'><code>steps</code></td><td valign='top'>Séquence propre ; en son absence, la séquence par défaut s'applique.</td></tr></table>
    <h2>Étapes de la séquence (steps)</h2>
    <table border="1" cellspacing="0" cellpadding="4" width="100%"><tr><th width="24%" align="left">Étape</th><th width="76%" align="left">Paramètres et effet</th></tr><tr><td valign='top'><code>session</code></td><td valign='top'><code>session</code> : session de diagnostic (0x10).</td></tr><tr><td valign='top'><code>comm_control</code></td><td valign='top'><code>control</code>, <code>comm_type</code> : contrôle de la communication (0x28).</td></tr><tr><td valign='top'><code>security</code></td><td valign='top'><code>level</code> : demander le seed, calculer et envoyer la key (0x27).</td></tr><tr><td valign='top'><code>erase</code></td><td valign='top'><code>block</code> (<code>all</code> ou numéro), <code>routine</code> (par défaut FF00) : effacer la mémoire (0x31).</td></tr><tr><td valign='top'><code>download</code></td><td valign='top'><code>block</code> : Request Download, Transfer Data, Transfer Exit (0x34, 0x36, 0x37).</td></tr><tr><td valign='top'><code>check</code>, <code>routine</code></td><td valign='top'><code>routine</code>, <code>data</code> (hex), <code>control</code>, <code>timeout_ms</code> : démarrer une routine (0x31).</td></tr><tr><td valign='top'><code>request</code></td><td valign='top'><code>data</code> (hex), <code>expect</code> (premiers octets de réponse attendus).</td></tr><tr><td valign='top'><code>reset</code></td><td valign='top'><code>reset</code> : réinitialisation du calculateur (0x11).</td></tr><tr><td valign='top'><code>wait</code>, <code>comment</code></td><td valign='top'><code>ms</code> durée d'attente ou <code>text</code> comme commentaire.</td></tr></table>
    <h2>Séquence par défaut</h2>
    <p>Sans <code>steps</code>, les opérations suivantes sont exécutées dans l'ordre : session 0x03, désactivation de la communication (0x28 03 01), session 0x02, Security Access (si <code>security</code> est défini), effacement et programmation de tous les blocs, réinitialisation du calculateur 0x11 01. Cette séquence est générique et non spécifique au constructeur.</p>
    <h2>Consignes de sécurité</h2>
    <p>Le flashage efface et écrase la mémoire du calculateur. L'alimentation et la connexion au bus ne doivent pas être interrompues pendant ce temps. Le code contenu dans les paquets n'est jamais exécuté ; les DLL Seed&amp;Key spécifiques au constructeur ne sont pas prises en charge. En cas d'erreur, la séquence s'arrête et les étapes restantes sont ignorées.</p>
