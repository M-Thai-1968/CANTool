  help.topic.appendix_c.title: "Appendix C: vFlash pack and manifest"
  help.topic.appendix_c.html: |-
    <h1>Appendix C: vFlash pack and manifest</h1>
    <p>The vFlash tab in the Diagnostics section loads a flash package, interprets it and runs it with the built-in UDS flash sequence on the selected hardware (Vector, PEAK, SocketCAN, simulation). The Vector software vFlash is not required.</p>
    <h2>Supported sources</h2>
    <ul><li><code>*.vflashpack</code> or <code>*.zip</code> with <code>flashpack.json</code> (or <code>flashpack.yaml</code>) and the data files: fully supported.</li><li>Genuine vFlash pack without a manifest: the internal format is not publicly documented. HEX, S-record and BIN files are found and the project is read heuristically. Sequence, addresses and seed&amp;key usually have to be added through a manifest.</li><li>Single manifest file or image (<code>.hex</code>, <code>.s19</code>, <code>.srec</code>, <code>.mot</code>, <code>.bin</code>) with the generic default sequence.</li></ul>
    <h2>Manifest flashpack.json</h2>
    [[pre:flashpack]]
    <table border="1" cellspacing="0" cellpadding="4" width="100%"><tr><th width="24%" align="left">Element</th><th width="76%" align="left">Meaning</th></tr><tr><td valign='top'><code>name</code>, <code>ecu</code></td><td valign='top'>Display name and ECU.</td></tr><tr><td valign='top'><code>request_id</code>, <code>response_id</code>, <code>extended</code>, <code>fd</code></td><td valign='top'>ISO-TP addressing; if missing, the diagnostic configuration of the Diagnostics section applies.</td></tr><tr><td valign='top'><code>security</code></td><td valign='top'>Seed&amp;key: <code>type</code> = <code>none</code>, <code>xor</code>, <code>add</code> or <code>constant</code>, plus <code>level</code> (seed level, key = level + 1) and <code>value</code>.</td></tr><tr><td valign='top'><code>address_format</code></td><td valign='top'>addressAndLengthFormatIdentifier, e.g. <code>0x44</code> = 4-byte length and 4-byte address.</td></tr><tr><td valign='top'><code>max_chunk</code></td><td valign='top'>Upper limit of the payload per transfer request (otherwise taken from the response to 0x34).</td></tr><tr><td valign='top'><code>data</code></td><td valign='top'>List of data files (<code>file</code>, <code>name</code>); for BIN files <code>address</code> is mandatory.</td></tr><tr><td valign='top'><code>steps</code></td><td valign='top'>Own sequence; if missing, the default sequence applies.</td></tr></table>
    <h2>Sequence steps (steps)</h2>
    <table border="1" cellspacing="0" cellpadding="4" width="100%"><tr><th width="24%" align="left">Step</th><th width="76%" align="left">Parameters and effect</th></tr><tr><td valign='top'><code>session</code></td><td valign='top'><code>session</code>: diagnostic session (0x10).</td></tr><tr><td valign='top'><code>comm_control</code></td><td valign='top'><code>control</code>, <code>comm_type</code>: communication control (0x28).</td></tr><tr><td valign='top'><code>security</code></td><td valign='top'><code>level</code>: request seed, compute and send key (0x27).</td></tr><tr><td valign='top'><code>erase</code></td><td valign='top'><code>block</code> (<code>all</code> or number), <code>routine</code> (default FF00): erase memory (0x31).</td></tr><tr><td valign='top'><code>download</code></td><td valign='top'><code>block</code>: request download, transfer data, transfer exit (0x34, 0x36, 0x37).</td></tr><tr><td valign='top'><code>check</code>, <code>routine</code></td><td valign='top'><code>routine</code>, <code>data</code> (hex), <code>control</code>, <code>timeout_ms</code>: start a routine (0x31).</td></tr><tr><td valign='top'><code>request</code></td><td valign='top'><code>data</code> (hex), <code>expect</code> (expected leading response bytes).</td></tr><tr><td valign='top'><code>reset</code></td><td valign='top'><code>reset</code>: ECU reset (0x11).</td></tr><tr><td valign='top'><code>wait</code>, <code>comment</code></td><td valign='top'><code>ms</code> wait time or <code>text</code> as a comment.</td></tr></table>
    <h2>Default sequence</h2>
    <p>Without <code>steps</code> the following is executed in order: session 0x03, disable communication (0x28 03 01), session 0x02, security access (if <code>security</code> is set), erase and program all blocks, ECU reset 0x11 01. This sequence is generic and not manufacturer-specific.</p>
    <h2>Safety notes</h2>
    <p>Flashing erases and overwrites memory of the ECU. The power supply and the bus connection must not be interrupted meanwhile. Code from packages is never executed; manufacturer-specific seed&amp;key DLLs are not supported. If an error occurs, the sequence stops and the remaining steps are skipped.</p>
