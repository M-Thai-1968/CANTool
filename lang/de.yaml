  help.topic.appendix_c.title: "Anhang C: vFlash-Pack und Manifest"
  help.topic.appendix_c.html: |-
    <h1>Anhang C: vFlash-Pack und Manifest</h1>
    <p>Der Reiter vFlash in der Rubrik Diagnose laedt ein Flash-Paket, interpretiert es und fuehrt es mit dem eigenen UDS-Flashablauf ueber die gewaehlte Hardware aus (Vector, PEAK, SocketCAN, Simulation). Die Vector-Software vFlash wird dafuer nicht benoetigt.</p>
    <h2>Unterstuetzte Quellen</h2>
    <ul><li><code>*.vflashpack</code> oder <code>*.zip</code> mit <code>flashpack.json</code> (oder <code>flashpack.yaml</code>) und den Datendateien: vollstaendig unterstuetzt.</li><li>Echtes vFlash-Pack ohne Manifest: Das interne Format ist nicht oeffentlich dokumentiert. HEX-, S-Record- und BIN-Dateien werden gefunden und das Projekt wird heuristisch gelesen. Ablauf, Adressen und Seed&amp;Key muessen meist ueber ein Manifest ergaenzt werden.</li><li>Einzelne Manifest-Datei oder Abbild (<code>.hex</code>, <code>.s19</code>, <code>.srec</code>, <code>.mot</code>, <code>.bin</code>) mit generischem Standardablauf.</li></ul>
    <h2>Manifest flashpack.json</h2>
    [[pre:flashpack]]
    <table border="1" cellspacing="0" cellpadding="4" width="100%"><tr><th width="24%" align="left">Element</th><th width="76%" align="left">Bedeutung</th></tr><tr><td valign='top'><code>name</code>, <code>ecu</code></td><td valign='top'>Anzeigename und Steuergeraet.</td></tr><tr><td valign='top'><code>request_id</code>, <code>response_id</code>, <code>extended</code>, <code>fd</code></td><td valign='top'>ISO-TP-Adressierung; fehlt sie, gilt die Diagnose-Konfiguration der Rubrik Diagnose.</td></tr><tr><td valign='top'><code>security</code></td><td valign='top'>Seed&amp;Key: <code>type</code> = <code>none</code>, <code>xor</code>, <code>add</code> oder <code>constant</code>, dazu <code>level</code> (Seed-Level, Key = Level + 1) und <code>value</code>.</td></tr><tr><td valign='top'><code>address_format</code></td><td valign='top'>addressAndLengthFormatIdentifier, z. B. <code>0x44</code> = 4 Byte Laenge und 4 Byte Adresse.</td></tr><tr><td valign='top'><code>max_chunk</code></td><td valign='top'>Obergrenze der Nutzdaten je Transfer-Request (sonst aus der Antwort auf 0x34).</td></tr><tr><td valign='top'><code>data</code></td><td valign='top'>Liste der Datendateien (<code>file</code>, <code>name</code>); fuer BIN-Dateien ist <code>address</code> Pflicht.</td></tr><tr><td valign='top'><code>steps</code></td><td valign='top'>Eigener Ablauf; fehlt er, gilt der Standardablauf.</td></tr></table>
    <h2>Ablaufschritte (steps)</h2>
    <table border="1" cellspacing="0" cellpadding="4" width="100%"><tr><th width="24%" align="left">Schritt</th><th width="76%" align="left">Parameter und Wirkung</th></tr><tr><td valign='top'><code>session</code></td><td valign='top'><code>session</code>: Diagnose-Session (0x10).</td></tr><tr><td valign='top'><code>comm_control</code></td><td valign='top'><code>control</code>, <code>comm_type</code>: Kommunikation steuern (0x28).</td></tr><tr><td valign='top'><code>security</code></td><td valign='top'><code>level</code>: Seed anfordern, Key berechnen und senden (0x27).</td></tr><tr><td valign='top'><code>erase</code></td><td valign='top'><code>block</code> (<code>all</code> oder Nummer), <code>routine</code> (Standard FF00): Speicher loeschen (0x31).</td></tr><tr><td valign='top'><code>download</code></td><td valign='top'><code>block</code>: Request Download, Transfer Data, Transfer Exit (0x34, 0x36, 0x37).</td></tr><tr><td valign='top'><code>check</code>, <code>routine</code></td><td valign='top'><code>routine</code>, <code>data</code> (Hex), <code>control</code>, <code>timeout_ms</code>: Routine starten (0x31).</td></tr><tr><td valign='top'><code>request</code></td><td valign='top'><code>data</code> (Hex), <code>expect</code> (erwartete Antwort-Anfangsbytes).</td></tr><tr><td valign='top'><code>reset</code></td><td valign='top'><code>reset</code>: ECU-Reset (0x11).</td></tr><tr><td valign='top'><code>wait</code>, <code>comment</code></td><td valign='top'><code>ms</code> Wartezeit bzw. <code>text</code> als Kommentar.</td></tr></table>
    <h2>Standardablauf</h2>
    <p>Ohne <code>steps</code> werden nacheinander ausgefuehrt: Session 0x03, Kommunikation abschalten (0x28 03 01), Session 0x02, Security Access (falls <code>security</code> gesetzt), Loeschen und Programmieren aller Bloecke, ECU-Reset 0x11 01. Dieser Ablauf ist generisch und nicht herstellerspezifisch.</p>
    <h2>Sicherheitshinweise</h2>
    <p>Flashen loescht und ueberschreibt Speicher des Steuergeraets. Spannungsversorgung und Busverbindung duerfen waehrenddessen nicht unterbrochen werden. Aus Paketen wird nie Code ausgefuehrt; herstellerspezifische Seed&amp;Key-DLLs werden nicht unterstuetzt. Bei einem Fehler stoppt der Ablauf, die restlichen Schritte werden uebersprungen.</p>
