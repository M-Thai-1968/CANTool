  help.topic.appendix_c.title: "ภาคผนวก C: แพ็ก vFlash และ Manifest"
  help.topic.appendix_c.html: |-
    <h1>ภาคผนวก C: แพ็ก vFlash และ Manifest</h1>
    <p>แท็บ vFlash ในหมวด Diagnose จะโหลดแพ็กแฟลช ตีความ และรันด้วยลำดับการแฟลช UDS ในตัวบนฮาร์ดแวร์ที่เลือก (Vector, PEAK, SocketCAN, simulation) โดยไม่ต้องใช้ซอฟต์แวร์ vFlash ของ Vector</p>
    <h2>แหล่งที่มาที่รองรับ</h2>
    <ul><li><code>*.vflashpack</code> หรือ <code>*.zip</code> ที่มี <code>flashpack.json</code> (หรือ <code>flashpack.yaml</code>) และไฟล์ข้อมูล: รองรับเต็มรูปแบบ</li><li>แพ็ก vFlash จริงที่ไม่มี manifest: รูปแบบภายในไม่มีเอกสารเผยแพร่สู่สาธารณะ ระบบจะค้นหาไฟล์ HEX, S-Record และ BIN และอ่านโปรเจกต์แบบ heuristic โดยส่วนใหญ่ต้องเพิ่มลำดับขั้นตอน address และ Seed&amp;Key ผ่าน manifest</li><li>ไฟล์ manifest เดี่ยวหรือ image (<code>.hex</code>, <code>.s19</code>, <code>.srec</code>, <code>.mot</code>, <code>.bin</code>) พร้อมลำดับขั้นตอนมาตรฐานทั่วไป</li></ul>
    <h2>Manifest flashpack.json</h2>
    [[pre:flashpack]]
    <table border="1" cellspacing="0" cellpadding="4" width="100%"><tr><th width="24%" align="left">องค์ประกอบ</th><th width="76%" align="left">ความหมาย</th></tr><tr><td valign='top'><code>name</code>, <code>ecu</code></td><td valign='top'>ชื่อที่แสดงและ ECU</td></tr><tr><td valign='top'><code>request_id</code>, <code>response_id</code>, <code>extended</code>, <code>fd</code></td><td valign='top'>การกำหนดแอดเดรส ISO-TP หากไม่ระบุ จะใช้การตั้งค่า Diagnose ของหมวด Diagnose</td></tr><tr><td valign='top'><code>security</code></td><td valign='top'>Seed&amp;Key: <code>type</code> = <code>none</code>, <code>xor</code>, <code>add</code> หรือ <code>constant</code> พร้อม <code>level</code> (seed level, key = level + 1) และ <code>value</code></td></tr><tr><td valign='top'><code>address_format</code></td><td valign='top'>addressAndLengthFormatIdentifier เช่น <code>0x44</code> = length 4 ไบต์ และ address 4 ไบต์</td></tr><tr><td valign='top'><code>max_chunk</code></td><td valign='top'>ขีดจำกัดสูงสุดของข้อมูลต่อ transfer request (มิฉะนั้นจะใช้ค่าจาก response ของ 0x34)</td></tr><tr><td valign='top'><code>data</code></td><td valign='top'>รายการไฟล์ข้อมูล (<code>file</code>, <code>name</code>) สำหรับไฟล์ BIN ต้องระบุ <code>address</code></td></tr><tr><td valign='top'><code>steps</code></td><td valign='top'>ลำดับขั้นตอนของตัวเอง หากไม่ระบุ จะใช้ลำดับขั้นตอนมาตรฐาน</td></tr></table>
    <h2>ขั้นตอนของลำดับ (steps)</h2>
    <table border="1" cellspacing="0" cellpadding="4" width="100%"><tr><th width="24%" align="left">ขั้นตอน</th><th width="76%" align="left">พารามิเตอร์และผล</th></tr><tr><td valign='top'><code>session</code></td><td valign='top'><code>session</code>: diagnostic session (0x10)</td></tr><tr><td valign='top'><code>comm_control</code></td><td valign='top'><code>control</code>, <code>comm_type</code>: communication control (0x28)</td></tr><tr><td valign='top'><code>security</code></td><td valign='top'><code>level</code>: ขอ seed คำนวณและส่ง key (0x27)</td></tr><tr><td valign='top'><code>erase</code></td><td valign='top'><code>block</code> (<code>all</code> หรือหมายเลข), <code>routine</code> (ค่าเริ่มต้น FF00): ลบหน่วยความจำ (0x31)</td></tr><tr><td valign='top'><code>download</code></td><td valign='top'><code>block</code>: Request Download, Transfer Data, Transfer Exit (0x34, 0x36, 0x37)</td></tr><tr><td valign='top'><code>check</code>, <code>routine</code></td><td valign='top'><code>routine</code>, <code>data</code> (hex), <code>control</code>, <code>timeout_ms</code>: เริ่ม routine (0x31)</td></tr><tr><td valign='top'><code>request</code></td><td valign='top'><code>data</code> (hex), <code>expect</code> (ไบต์แรกของ response ที่คาดไว้)</td></tr><tr><td valign='top'><code>reset</code></td><td valign='top'><code>reset</code>: ECU reset (0x11)</td></tr><tr><td valign='top'><code>wait</code>, <code>comment</code></td><td valign='top'><code>ms</code> เวลารอ หรือ <code>text</code> เป็นความคิดเห็น</td></tr></table>
    <h2>ลำดับขั้นตอนมาตรฐาน</h2>
    <p>หากไม่มี <code>steps</code> จะดำเนินการตามลำดับดังนี้: session 0x03, ปิดการสื่อสาร (0x28 03 01), session 0x02, security access (หากตั้ง <code>security</code>), ลบและโปรแกรมทุก block, ECU reset 0x11 01 ลำดับนี้เป็นแบบทั่วไปและไม่เฉพาะผู้ผลิต</p>
    <h2>ข้อควรระวังด้านความปลอดภัย</h2>
    <p>การแฟลชจะลบและเขียนทับหน่วยความจำของ ECU ห้ามตัดแหล่งจ่ายไฟและการเชื่อมต่อบัสในระหว่างนี้ โค้ดจากแพ็กจะไม่ถูกรันเด็ดขาด และไม่รองรับ DLL Seed&amp;Key เฉพาะผู้ผลิต เมื่อเกิดข้อผิดพลาด ลำดับขั้นตอนจะหยุดและข้ามขั้นตอนที่เหลือ</p>
