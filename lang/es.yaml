  help.topic.appendix_c.title: "Anexo C: paquete vFlash y manifiesto"
  help.topic.appendix_c.html: |-
    <h1>Anexo C: paquete vFlash y manifiesto</h1>
    <p>La pestaña vFlash de la sección Diagnóstico carga un paquete de flasheo, lo interpreta y lo ejecuta con la secuencia de flasheo UDS integrada en el hardware seleccionado (Vector, PEAK, SocketCAN, simulación). El software Vector vFlash no es necesario.</p>
    <h2>Fuentes admitidas</h2>
    <ul><li><code>*.vflashpack</code> o <code>*.zip</code> con <code>flashpack.json</code> (o <code>flashpack.yaml</code>) y los archivos de datos: totalmente compatible.</li><li>Paquete vFlash original sin manifiesto: el formato interno no está documentado públicamente. Se encuentran los archivos HEX, S-record y BIN y el proyecto se lee de forma heurística. La secuencia, las direcciones y Seed&amp;Key normalmente deben añadirse mediante un manifiesto.</li><li>Archivo de manifiesto único o imagen (<code>.hex</code>, <code>.s19</code>, <code>.srec</code>, <code>.mot</code>, <code>.bin</code>) con la secuencia predeterminada genérica.</li></ul>
    <h2>Manifiesto flashpack.json</h2>
    [[pre:flashpack]]
    <table border="1" cellspacing="0" cellpadding="4" width="100%"><tr><th width="24%" align="left">Elemento</th><th width="76%" align="left">Significado</th></tr><tr><td valign='top'><code>name</code>, <code>ecu</code></td><td valign='top'>Nombre para mostrar y ECU.</td></tr><tr><td valign='top'><code>request_id</code>, <code>response_id</code>, <code>extended</code>, <code>fd</code></td><td valign='top'>Direccionamiento ISO-TP; si faltan, se aplica la configuración de diagnóstico de la sección Diagnóstico.</td></tr><tr><td valign='top'><code>security</code></td><td valign='top'>Seed&amp;Key: <code>type</code> = <code>none</code>, <code>xor</code>, <code>add</code> o <code>constant</code>, más <code>level</code> (nivel de seed, key = level + 1) y <code>value</code>.</td></tr><tr><td valign='top'><code>address_format</code></td><td valign='top'>addressAndLengthFormatIdentifier, p. ej. <code>0x44</code> = longitud de 4 bytes y dirección de 4 bytes.</td></tr><tr><td valign='top'><code>max_chunk</code></td><td valign='top'>Límite superior de la carga útil por solicitud de transferencia (de lo contrario se toma de la respuesta a 0x34).</td></tr><tr><td valign='top'><code>data</code></td><td valign='top'>Lista de archivos de datos (<code>file</code>, <code>name</code>); para archivos BIN, <code>address</code> es obligatorio.</td></tr><tr><td valign='top'><code>steps</code></td><td valign='top'>Secuencia propia; si falta, se aplica la secuencia predeterminada.</td></tr></table>
    <h2>Pasos de la secuencia (steps)</h2>
    <table border="1" cellspacing="0" cellpadding="4" width="100%"><tr><th width="24%" align="left">Paso</th><th width="76%" align="left">Parámetros y efecto</th></tr><tr><td valign='top'><code>session</code></td><td valign='top'><code>session</code>: sesión de diagnóstico (0x10).</td></tr><tr><td valign='top'><code>comm_control</code></td><td valign='top'><code>control</code>, <code>comm_type</code>: control de comunicación (0x28).</td></tr><tr><td valign='top'><code>security</code></td><td valign='top'><code>level</code>: solicitar seed, calcular y enviar key (0x27).</td></tr><tr><td valign='top'><code>erase</code></td><td valign='top'><code>block</code> (<code>all</code> o número), <code>routine</code> (por defecto FF00): borrar memoria (0x31).</td></tr><tr><td valign='top'><code>download</code></td><td valign='top'><code>block</code>: solicitar descarga, transferir datos, finalizar transferencia (0x34, 0x36, 0x37).</td></tr><tr><td valign='top'><code>check</code>, <code>routine</code></td><td valign='top'><code>routine</code>, <code>data</code> (hex), <code>control</code>, <code>timeout_ms</code>: iniciar una rutina (0x31).</td></tr><tr><td valign='top'><code>request</code></td><td valign='top'><code>data</code> (hex), <code>expect</code> (primeros bytes esperados de la respuesta).</td></tr><tr><td valign='top'><code>reset</code></td><td valign='top'><code>reset</code>: reinicio de la ECU (0x11).</td></tr><tr><td valign='top'><code>wait</code>, <code>comment</code></td><td valign='top'><code>ms</code> tiempo de espera o <code>text</code> como comentario.</td></tr></table>
    <h2>Secuencia predeterminada</h2>
    <p>Sin <code>steps</code> se ejecuta lo siguiente en orden: sesión 0x03, desactivar la comunicación (0x28 03 01), sesión 0x02, acceso de seguridad (si <code>security</code> está definido), borrar y programar todos los bloques, reinicio de la ECU 0x11 01. Esta secuencia es genérica y no es específica de ningún fabricante.</p>
    <h2>Notas de seguridad</h2>
    <p>El flasheo borra y sobrescribe la memoria de la ECU. La alimentación y la conexión al bus no deben interrumpirse mientras tanto. El código de los paquetes nunca se ejecuta; las DLL de Seed&amp;Key específicas del fabricante no son compatibles. Si se produce un error, la secuencia se detiene y los pasos restantes se omiten.</p>
