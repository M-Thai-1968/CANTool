  help.topic.appendix_c.title: "附录 C:vFlash 包与清单文件"
  help.topic.appendix_c.html: |-
    <h1>附录 C:vFlash 包与清单文件</h1>
    <p>“诊断”部分的 vFlash 选项卡用于加载刷写包、对其进行解析,并使用内置的 UDS 刷写流程在所选硬件(Vector、PEAK、SocketCAN、仿真)上运行。无需 Vector 软件 vFlash。</p>
    <h2>支持的来源</h2>
    <ul><li><code>*.vflashpack</code> 或 <code>*.zip</code>,包含 <code>flashpack.json</code>(或 <code>flashpack.yaml</code>)及数据文件:完全支持。</li><li>不含清单文件的原生 vFlash 包:其内部格式未公开。程序会找出 HEX、S-record 和 BIN 文件,并以启发式方式读取工程。流程、地址和 Seed&amp;Key 通常需要通过清单文件补充。</li><li>单个清单文件或镜像(<code>.hex</code>、<code>.s19</code>、<code>.srec</code>、<code>.mot</code>、<code>.bin</code>),将使用通用默认流程。</li></ul>
    <h2>清单文件 flashpack.json</h2>
    [[pre:flashpack]]
    <table border="1" cellspacing="0" cellpadding="4" width="100%"><tr><th width="24%" align="left">元素</th><th width="76%" align="left">含义</th></tr><tr><td valign='top'><code>name</code>, <code>ecu</code></td><td valign='top'>显示名称和 ECU。</td></tr><tr><td valign='top'><code>request_id</code>, <code>response_id</code>, <code>extended</code>, <code>fd</code></td><td valign='top'>ISO-TP 寻址;若缺省,则采用“诊断”部分的诊断配置。</td></tr><tr><td valign='top'><code>security</code></td><td valign='top'>Seed&amp;Key:<code>type</code> = <code>none</code>、<code>xor</code>、<code>add</code> 或 <code>constant</code>,以及 <code>level</code>(seed 级别,key = level + 1)和 <code>value</code>。</td></tr><tr><td valign='top'><code>address_format</code></td><td valign='top'>addressAndLengthFormatIdentifier,例如 <code>0x44</code> = 4 字节长度和 4 字节地址。</td></tr><tr><td valign='top'><code>max_chunk</code></td><td valign='top'>每次传输请求的有效载荷上限(否则取自 0x34 的响应)。</td></tr><tr><td valign='top'><code>data</code></td><td valign='top'>数据文件列表(<code>file</code>、<code>name</code>);对于 BIN 文件,<code>address</code> 为必填项。</td></tr><tr><td valign='top'><code>steps</code></td><td valign='top'>自定义流程;若缺省,则采用默认流程。</td></tr></table>
    <h2>流程步骤 (steps)</h2>
    <table border="1" cellspacing="0" cellpadding="4" width="100%"><tr><th width="24%" align="left">步骤</th><th width="76%" align="left">参数与作用</th></tr><tr><td valign='top'><code>session</code></td><td valign='top'><code>session</code>:诊断会话 (0x10)。</td></tr><tr><td valign='top'><code>comm_control</code></td><td valign='top'><code>control</code>、<code>comm_type</code>:通信控制 (0x28)。</td></tr><tr><td valign='top'><code>security</code></td><td valign='top'><code>level</code>:请求 seed,计算并发送 key (0x27)。</td></tr><tr><td valign='top'><code>erase</code></td><td valign='top'><code>block</code>(<code>all</code> 或编号)、<code>routine</code>(默认 FF00):擦除存储器 (0x31)。</td></tr><tr><td valign='top'><code>download</code></td><td valign='top'><code>block</code>:请求下载、传输数据、退出传输 (0x34, 0x36, 0x37)。</td></tr><tr><td valign='top'><code>check</code>, <code>routine</code></td><td valign='top'><code>routine</code>、<code>data</code>(十六进制)、<code>control</code>、<code>timeout_ms</code>:启动例程 (0x31)。</td></tr><tr><td valign='top'><code>request</code></td><td valign='top'><code>data</code>(十六进制)、<code>expect</code>(期望的响应起始字节)。</td></tr><tr><td valign='top'><code>reset</code></td><td valign='top'><code>reset</code>:ECU 复位 (0x11)。</td></tr><tr><td valign='top'><code>wait</code>, <code>comment</code></td><td valign='top'><code>ms</code> 为等待时间,或 <code>text</code> 作为注释。</td></tr></table>
    <h2>默认流程</h2>
    <p>未设置 <code>steps</code> 时,将按顺序执行:会话 0x03、禁用通信 (0x28 03 01)、会话 0x02、安全访问(若设置了 <code>security</code>)、擦除并编程所有数据块、ECU 复位 0x11 01。该流程为通用流程,非整车厂专用。</p>
    <h2>安全注意事项</h2>
    <p>刷写会擦除并覆盖 ECU 的存储器。在此期间不得中断供电和总线连接。包中的代码绝不会被执行;不支持整车厂专用的 Seed&amp;Key DLL。若发生错误,流程将停止,其余步骤将被跳过。</p>
